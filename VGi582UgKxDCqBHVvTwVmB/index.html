<title>Shared Prototype</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0d12; color: #fff; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* OMF blue into the deepest OMF blue (--color-omf-blue → --color-omf-black-blue); the glass card shows it through */
  .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; overflow: auto; background: linear-gradient(160deg, #2659D9 0%, #152960 100%); }
  .gate-card { width: min(540px, 100%); box-sizing: border-box; padding: clamp(28px, 7vw, 56px); border: 1px solid rgba(255,255,255,.24); border-radius: 24px; background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); -webkit-backdrop-filter: blur(24px) saturate(140%); backdrop-filter: blur(24px) saturate(140%); box-shadow: 0 8px 32px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.3); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .gate-card { background: rgba(30,58,132,.92); } }
  .gate-logo { display: block; width: 168px; height: auto; margin: 0 auto 20px; }
  .gate-eyebrow { margin: 0 0 48px; color: #ffe05c; font-size: 32px; font-weight: 500; line-height: 1.2; text-align: center; }
  .gate-title { margin: 0 0 16px; color: rgba(255,255,255,.85); font-size: 16px; font-weight: 500; line-height: 1.4; }
  .gate label { display: block; margin-bottom: 6px; color: rgba(255,255,255,.85); font-size: 14px; }
  .gate-field { position: relative; }
  .gate-field input { padding-right: 48px; }
  .gate-name { margin-bottom: 16px; }
  .gate input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid rgba(255,255,255,.28); border-radius: 10px; background: rgba(255,255,255,.10); color: #fff; font: inherit; font-size: 16px; transition: border-color .12s, box-shadow .12s, background .12s; }
  .gate input:focus { outline: none; border-color: #fff; background: rgba(255,255,255,.14); box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .gate-submit { width: 100%; margin-top: 16px; padding: 10px 16px; border: 0; border-radius: 10px; background: linear-gradient(180deg, #FFE05C, #F5CC3D); color: #1A1A1A; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 16px rgba(255,224,92,.3), inset 0 1px 0 rgba(255,255,255,.5); transition: box-shadow .12s, transform .12s; }
  .gate-submit:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(255,224,92,.45), inset 0 1px 0 rgba(255,255,255,.5); transform: translateY(-1px); }
  .gate-submit:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .gate-submit:disabled { opacity: .7; cursor: default; }
  .gate-reveal { position: absolute; top: 50%; right: 4px; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: rgba(255,255,255,.7); cursor: pointer; transform: translateY(-50%); }
  .gate-reveal:hover { color: #fff; background: rgba(255,255,255,.12); }
  .gate-reveal:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  .gate-error { margin: 10px 0 0; color: #ffe05c; font-size: 14px; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
